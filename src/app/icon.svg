<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Solid sketch drop-shadow -->
  <rect
    x="11"
    y="10"
    width="48"
    height="48"
    rx="10"
    transform="rotate(-2 35 34)"
    fill="#1a1a1a"
  />
  <!-- Main hand-drawn green card -->
  <rect
    x="8"
    y="6"
    width="48"
    height="48"
    rx="10"
    transform="rotate(-2 32 30)"
    fill="#1b5e43"
    stroke="#1a1a1a"
    stroke-width="3.5"
    stroke-linejoin="round"
  />
  <!-- Bold White Letter P -->
  <text
    x="32"
    y="31"
    transform="rotate(-2 32 30)"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="34"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="central"
  >P</text>
</svg>
